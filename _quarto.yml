project:
  type: website
  output-dir: docs
  pre-render: "python3 scripts/collect_posts.py"
  post-render: "rm -f docs/search.json"
  resources:
    - data/posts.json
    - papers.js
    - graph.js
    - post-meta.js

website:
  title: "jwkim.log"
  site-url: https://mqjinwon.github.io/blogs
  search: false
  navbar:
    right:
      - text: Papers
        href: papers.qmd
      - icon: github
        href: https://github.com/mqjinwon

  page-footer:
    left: "© 2026 Jinwon Kim"
    right:
      - icon: github
        href: https://github.com/mqjinwon
      - icon: linkedin
        href: https://linkedin.com/in/robotics-jinwon
      - icon: youtube
        href: https://youtube.com/@robotminsu

format:
  html:
    theme: [cosmo, custom.scss]
    toc: false
    include-after-body: listing-fix.html
