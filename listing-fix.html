<script>
// Multi-select AND category filter for the home listing.
// data-categories is base64(urlencoded joined string) in Quarto 1.6+.
(function () {
  var selected = {}; // decoded category name -> true
  var categoryButtons = [];

  function decodeCats(b64) {
    if (!b64) return [];
    try {
      return decodeURIComponent(atob(b64)).split(",").filter(Boolean);
    } catch (e) {
      return [];
    }
  }

  function selectedNames() {
    return Object.keys(selected).filter(function (k) {
      return selected[k];
    });
  }

  function applyFilter() {
    var names = selectedNames();
    var listings = window["quarto-listings"] || {};
    Object.keys(listings).forEach(function (listingId) {
      var list = listings[listingId];
      if (!names.length) {
        list.filter();
        return;
      }
      list.filter(function (item) {
        var vals = item.values();
        if (vals.categories == null) return false;
        var cats = decodeCats(vals.categories);
        for (var i = 0; i < names.length; i++) {
          if (cats.indexOf(names[i]) < 0) return false;
        }
        return true;
      });
    });
    paintActive();
  }

  function paintActive() {
    var names = selectedNames();
    var nameSet = {};
    names.forEach(function (n) {
      nameSet[n] = true;
    });

    categoryButtons.forEach(function (el) {
      var b64 = el.getAttribute("data-category") || "";
      if (!b64) {
        // "All"
        el.classList.toggle("active", names.length === 0);
        return;
      }
      var name = "";
      try {
        name = atob(b64);
      } catch (e) {
        name = b64;
      }
      el.classList.toggle("active", !!nameSet[name]);
    });

    // also highlight row chips
    document.querySelectorAll(".listing-category").forEach(function (el) {
      var t = (el.textContent || "").trim();
      el.classList.toggle("active", !!nameSet[t]);
    });
  }

  function toggleName(name) {
    if (!name) {
      selected = {};
    } else if (selected[name]) {
      delete selected[name];
    } else {
      selected[name] = true;
    }
    applyFilter();
  }

  function toggleB64(b64) {
    if (!b64) {
      toggleName("");
      return;
    }
    var name = "";
    try {
      name = atob(b64);
    } catch (e) {
      name = b64;
    }
    toggleName(name);
  }

  // Replace Quarto single-select handler
  window.quartoListingCategory = function (categoryB64) {
    toggleB64(categoryB64 || "");
  };

  window.addEventListener("load", function () {
    categoryButtons = Array.prototype.slice.call(
      document.querySelectorAll(".quarto-listing-category .category")
    );
    categoryButtons.forEach(function (el) {
      var cat = el.getAttribute("data-category");
      el.onclick = function (e) {
        e.preventDefault();
        toggleB64(cat);
      };
    });

    document.querySelectorAll(".quarto-listing-category-title").forEach(function (el) {
      el.onclick = function (e) {
        e.preventDefault();
        toggleName("");
      };
    });

    // row chips already call window.quartoListingCategory
    applyFilter();
  });
})();
</script>
